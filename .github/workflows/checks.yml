name: Phase 1 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, unit, build, Chromium, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://auth.example.test
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_phase1_only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test:unit
      - name: Invalid configuration checks
        run: pnpm test:config
      - name: Production build with synthetic configuration
        run: pnpm build:test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Chromium browser tests
        run: pnpm test:e2e
      - name: Secret scan (inventory, build, history)
        run: pnpm secret:scan
      - name: Synthetic browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chromium-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
